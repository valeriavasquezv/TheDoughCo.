<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costos Pastelería</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--text:#292724;--muted:#77716b;--line:#e8e2dc;--accent:#8b5e4b;--good:#347a57;--warn:#b67a1c;--bad:#b54b4b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff}button.secondary{background:#eee8e2;color:var(--text)}button.danger{background:#f5dddd;color:#8c3030}
.app{display:flex;min-height:100vh}.side{width:220px;background:#fff;border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px;margin-bottom:25px}.nav button{width:100%;text-align:left;background:transparent;color:var(--text);margin:3px 0}.nav button.active,.nav button:hover{background:#f1e8e2}.main{flex:1;padding:28px;max-width:1250px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:750}.sub{color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:750;margin-top:8px}.label{color:var(--muted);font-size:14px}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h2{font-size:19px;margin:0}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:13px;color:var(--muted);font-weight:600}.actions{display:flex;gap:7px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px}.good{background:#e0f0e7;color:var(--good)}.warn{background:#fff0d4;color:var(--warn)}.bad{background:#f7dfdf;color:var(--bad)}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #ddd5ce;border-radius:10px;background:#fff}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:18px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.hidden{display:none!important}.recipe-line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.notice{padding:13px;border-radius:12px;background:#f2ece7;margin:12px 0}.empty{padding:30px;text-align:center;color:var(--muted)}.mobilebar{display:none}
@media(max-width:800px){.side{display:none}.main{padding:18px 14px 85px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:8;padding:7px;gap:4px}.mobilebar button{flex:1;background:transparent;color:var(--text);padding:8px 4px;font-size:12px}.mobilebar button.active{background:#f1e8e2}.top .secondary{display:none}.recipe-line{grid-template-columns:1fr 1fr}.recipe-line select{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">🍰 Costos Pastelería</div><div class="nav" id="nav"></div></aside>
<main class="main"><div id="view"></div></main>
</div>
<div class="mobilebar" id="mobilebar"></div>
<div class="modal hidden" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='pasteleria_costos_v1';
const seed={settings:{iva:19,target:40,currency:'CLP'},ingredients:[
{id:'i1',name:'Harina',cat:'Secos',supplier:'Ejemplo',qty:1000,unit:'g',net:1200,withIva:1428,date:'2026-08-01'},
{id:'i2',name:'Azúcar',cat:'Secos',supplier:'Ejemplo',qty:1000,unit:'g',net:1100,withIva:1309,date:'2026-08-01'},
{id:'i3',name:'Mantequilla',cat:'Lácteos',supplier:'Ejemplo',qty:250,unit:'g',net:2200,withIva:2618,date:'2026-08-01'},
{id:'i4',name:'Huevos',cat:'Huevos',supplier:'Ejemplo',qty:12,unit:'un',net:3000,withIva:3570,date:'2026-08-01'},
{id:'i5',name:'Chocolate',cat:'Chocolate',supplier:'Ejemplo',qty:1000,unit:'g',net:6500,withIva:7735,date:'2026-08-01'}],
recipes:[
{id:'r1',name:'Cookie Chocolate Chip',cat:'Galletas',yield:20,lines:[{ingredientId:'i1',qty:300},{ingredientId:'i2',qty:120},{ingredientId:'i3',qty:180},{ingredientId:'i5',qty:180}]},
{id:'r2',name:'Brownie',cat:'Brownies',yield:12,lines:[{ingredientId:'i1',qty:150},{ingredientId:'i2',qty:180},{ingredientId:'i3',qty:150},{ingredientId:'i4',qty:3},{ingredientId:'i5',qty:250}]}],
products:[
{id:'p1',name:'Cookie Chocolate Chip',recipeId:'r1',pack:150,labor:300,price:2500,active:true},
{id:'p2',name:'Brownie',recipeId:'r2',pack:180,labor:350,price:2800,active:true}],
fixed:[{id:'f1',name:'Arriendo',amount:300000,period:'Mensual'},{id:'f2',name:'Luz',amount:60000,period:'Mensual'}],labor:[]};
let db=load(),page='dashboard';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-CL')}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ingredientCost(i){return i&&i.qty>0?i.net/i.qty:0}
function recipeCost(r){return (r?.lines||[]).reduce((s,l)=>s+ingredientCost(db.ingredients.find(i=>i.id===l.ingredientId))*Number(l.qty||0),0)}
function monthlyFixed(){return db.fixed.reduce((s,x)=>s+Number(x.amount||0),0)}
function netPrice(p){return p.price}
function productCost(p){const r=db.recipes.find(x=>x.id===p.recipeId);return (r?recipeCost(r)/Math.max(1,r.yield):0)+Number(p.pack||0)+Number(p.labor||0)}
function margin(p){let c=productCost(p),price=netPrice(p);return price?((price-c)/price*100):0}
function fmt(n){return Number(n||0).toLocaleString('es-CL',{maximumFractionDigits:1})}
function renderNav(){let items=[['dashboard','🏠 Inicio'],['ingredients','🥣 Ingredientes'],['recipes','📖 Recetas'],['products','🍪 Productos'],['costs','💸 Costos'],['breakeven','🎯 Punto de equilibrio'],['settings','⚙️ Configuración']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('mobilebar').innerHTML=items.slice(0,5).map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;renderNav();render()}
function render(){const v=document.getElementById('view'); if(page==='dashboard')v.innerHTML=dashboard(); if(page==='ingredients')v.innerHTML=ingredients(); if(page==='recipes')v.innerHTML=recipes(); if(page==='products')v.innerHTML=products(); if(page==='costs')v.innerHTML=costs(); if(page==='breakeven')v.innerHTML=breakeven(); if(page==='settings')v.innerHTML=settings()}
function dashboard(){let ps=db.products.filter(p=>p.active), avgc=ps.length?ps.reduce((s,p)=>s+productCost(p),0)/ps.length:0, avgp=ps.length?ps.reduce((s,p)=>s+p.price,0)/ps.length:0, avgm=ps.length?ps.reduce((s,p)=>s+margin(p),0)/ps.length:0;return `<div class="top"><div><div class="title">Resumen</div><div class="sub">Tu información de costos, de un vistazo.</div></div><button onclick="openProduct()">+ Crear producto</button></div><div class="grid"><div class="card"><div class="label">Productos registrados</div><div class="metric">${db.products.length}</div></div><div class="card"><div class="label">Costo promedio</div><div class="metric">${money(avgc)}</div></div><div class="card"><div class="label">Precio promedio</div><div class="metric">${money(avgp)}</div></div><div class="card"><div class="label">Margen promedio</div><div class="metric">${fmt(avgm)}%</div></div><div class="card"><div class="label">Costos fijos mensuales</div><div class="metric">${money(monthlyFixed())}</div></div><div class="card"><div class="label">IVA configurado</div><div class="metric">${db.settings.iva}%</div></div></div><div class="section"><div class="sectionhead"><h2>Productos</h2><button class="secondary" onclick="go('products')">Ver todos</button></div><div class="tablewrap"><table class="table"><tr><th>Producto</th><th>Costo</th><th>Venta neta</th><th>Margen</th></tr>${ps.slice(0,6).map(p=>`<tr><td>${p.name}</td><td>${money(productCost(p))}</td><td>${money(p.price)}</td><td><span class="pill ${margin(p)>=db.settings.target?'good':margin(p)>=0?'warn':'bad'}">${fmt(margin(p))}%</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Aún no hay productos.</td></tr>'}</table></div></div>`}
function ingredients(){return `<div class="top"><div><div class="title">Ingredientes</div><div class="sub">Guarda el precio que pagas y úsalo automáticamente en tus recetas.</div></div><button onclick="openIngredient()">+ Agregar</button></div><div class="notice">IVA actual: <b>${db.settings.iva}%</b>. Ingresa siempre el precio neto de compra en esta primera versión.</div><div class="tablewrap"><table class="table"><tr><th>Ingrediente</th><th>Categoría</th><th>Formato</th><th>Precio neto</th><th>Costo por unidad</th><th></th></tr>${db.ingredients.map(i=>`<tr><td>${i.name}</td><td>${i.cat}</td><td>${i.qty} ${i.unit}</td><td>${money(i.net)}</td><td>${money(ingredientCost(i))} / ${i.unit}</td><td class="actions"><button class="secondary" onclick="openIngredient('${i.id}')">Editar</button><button class="danger" onclick="del('ingredients','${i.id}')">Eliminar</button></td></tr>`).join('')}</table></div>`}
function recipes(){return `<div class="top"><div><div class="title">Recetas</div><div class="sub">El costo se actualiza solo cuando cambia un ingrediente.</div></div><button onclick="openRecipe()">+ Nueva receta</button></div><div class="grid">${db.recipes.map(r=>`<div class="card"><b>${r.name}</b><div class="sub">${r.cat} · ${r.yield} unidades</div><div class="metric">${money(recipeCost(r))}</div><div class="label">Costo total · ${money(recipeCost(r)/Math.max(1,r.yield))} por unidad</div><div class="actions" style="margin-top:14px"><button class="secondary" onclick="openRecipe('${r.id}')">Editar</button><button class="danger" onclick="del('recipes','${r.id}')">Eliminar</button></div></div>`).join('')}</div>`}
function products(){return `<div class="top"><div><div class="title">Productos</div><div class="sub">Aquí ves cuánto te cuesta realmente cada producto.</div></div><button onclick="openProduct()">+ Nuevo producto</button></div><div class="tablewrap"><table class="table"><tr><th>Producto</th><th>Costo total</th><th>Precio neto</th><th>Ganancia</th><th>Margen</th><th></th></tr>${db.products.map(p=>{let c=productCost(p),g=p.price-c,m=margin(p);return `<tr><td><b>${p.name}</b><br><span class="label">${db.recipes.find(r=>r.id===p.recipeId)?.name||'Sin receta'}</span></td><td>${money(c)}</td><td>${money(p.price)}</td><td>${money(g)}</td><td><span class="pill ${m>=db.settings.target?'good':m>=0?'warn':'bad'}">${fmt(m)}%</span></td><td class="actions"><button class="secondary" onclick="openProduct('${p.id}')">Editar</button><button class="danger" onclick="del('products','${p.id}')">Eliminar</button></td></tr>`}).join('')}</table></div>`}
function costs(){return `<div class="top"><div><div class="title">Otros costos</div><div class="sub">Packaging y gastos fijos.</div></div><button onclick="openFixed()">+ Agregar costo fijo</button></div><div class="card"><b>Costos fijos mensuales</b><div class="metric">${money(monthlyFixed())}</div></div><div class="section"><div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>Periodicidad</th><th>Monto</th><th></th></tr>${db.fixed.map(x=>`<tr><td>${x.name}</td><td>${x.period}</td><td>${money(x.amount)}</td><td class="actions"><button class="secondary" onclick="openFixed('${x.id}')">Editar</button><button class="danger" onclick="del('fixed','${x.id}')">Eliminar</button></td></tr>`).join('')}</table></div></div><div class="section"><div class="sectionhead"><h2>Packaging y mano de obra</h2><span class="label">Se asignan desde Productos.</span></div><div class="notice">En cada producto puedes ingresar directamente el costo por unidad de packaging y mano de obra. Así mantienes el uso diario rápido.</div></div>`}
function breakeven(){let ps=db.products.filter(p=>p.active),chosen=ps[0],price=chosen?.price||0,cost=chosen?productCost(chosen):0,con=price-cost,units=con>0?monthlyFixed()/con:0;return `<div class="top"><div><div class="title">Punto de equilibrio</div><div class="sub">Cuánto necesitas vender para cubrir tus costos fijos.</div></div></div><div class="card"><div class="form"><div class="field full"><label>Producto</label><select onchange="page='breakeven';renderBreakeven(this.value)">${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div></div><div class="grid" style="margin-top:18px"><div><div class="label">Costos fijos</div><div class="metric">${money(monthlyFixed())}</div></div><div><div class="label">Margen de contribución</div><div class="metric">${money(con)}</div></div><div><div class="label">Punto de equilibrio</div><div class="metric">${isFinite(units)?Math.ceil(units):'—'} unidades</div></div><div><div class="label">Ventas para equilibrar</div><div class="metric">${isFinite(units)?money(Math.ceil(units)*price):'—'}</div></div></div><div class="notice" style="margin-top:20px">Necesitas vender aproximadamente <b>${isFinite(units)?Math.ceil(units):'—'} unidades al mes</b> de este producto para cubrir tus costos fijos.</div></div>`}
function renderBreakeven(id){let p=db.products.find(x=>x.id===id)||db.products[0];if(!p){render();return}render();setTimeout(()=>{let s=document.querySelector('.card select');if(s)s.value=p.id},0)}
function settings(){return `<div class="top"><div><div class="title">Configuración</div><div class="sub">Parámetros generales de tu negocio.</div></div></div><div class="card"><div class="form"><div class="field"><label>IVA (%)</label><input id="iva" type="number" value="${db.settings.iva}"></div><div class="field"><label>Margen objetivo (%)</label><input id="target" type="number" value="${db.settings.target}"></div><div class="field"><label>Moneda</label><select id="currency"><option>CLP</option></select></div></div><button style="margin-top:15px" onclick="saveSettings()">Guardar configuración</button></div><div class="notice">Los cálculos son para gestión interna y no reemplazan una declaración tributaria.</div><div class="section"><button class="danger" onclick="resetData()">Restaurar datos de ejemplo</button></div>`}
function modal(content){document.getElementById('modalbox').innerHTML=content;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openIngredient(id){let x=db.ingredients.find(i=>i.id===id)||{name:'',cat:'',supplier:'',qty:1000,unit:'g',net:0,date:new Date().toISOString().slice(0,10)};modal(`<div class="modalhead"><h2>${id?'Editar':'Agregar'} ingrediente</h2><button class="secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><div class="field"><label>Nombre</label><input id="n" value="${x.name}"></div><div class="field"><label>Categoría</label><input id="c" value="${x.cat}"></div><div class="field"><label>Proveedor</label><input id="s" value="${x.supplier}"></div><div class="field"><label>Cantidad comprada</label><input id="q" type="number" value="${x.qty}"></div><div class="field"><label>Unidad</label><select id="u"><option ${x.unit==='g'?'selected':''}>g</option><option ${x.unit==='kg'?'selected':''}>kg</option><option ${x.unit==='ml'?'selected':''}>ml</option><option ${x.unit==='un'?'selected':''}>un</option></select></div><div class="field"><label>Precio neto</label><input id="p" type="number" value="${x.net}"></div><div class="field"><label>Fecha de compra</label><input id="d" type="date" value="${x.date||''}"></div></div><button style="margin-top:15px" onclick="saveIngredient('${id||''}')">Guardar</button>`)}
function saveIngredient(id){let x={id:id||uid('i'),name:n.value.trim(),cat:c.value.trim(),supplier:s.value.trim(),qty:+q.value,unit:u.value,net:+p.value,date:d.value};if(!x.name||!x.qty){alert('Completa nombre y cantidad.');return}let old=db.ingredients.find(i=>i.id===id);if(old&&old.net!==x.net){old.history=old.history||[];old.history.push({date:new Date().toISOString().slice(0,10),old:old.net,new:x.net,supplier:x.supplier})}if(old)Object.assign(old,x);else db.ingredients.push(x);save();closeModal();render()}
function openRecipe(id){let r=db.recipes.find(x=>x.id===id)||{name:'',cat:'',yield:1,lines:[]};modal(`<div class="modalhead"><h2>${id?'Editar':'Nueva'} receta</h2><button class="secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><div class="field"><label>Nombre</label><input id="rn" value="${r.name}"></div><div class="field"><label>Categoría</label><input id="rc" value="${r.cat}"></div><div class="field"><label>Rendimiento (unidades)</label><input id="ry" type="number" value="${r.yield}"></div></div><div class="section"><h2>Ingredientes</h2><div id="lines"></div><button class="secondary" onclick="addLine()">+ Ingrediente</button></div><button style="margin-top:15px" onclick="saveRecipe('${id||''}')">Guardar receta</button>`);window.editLines=r.lines.map(x=>({...x}));drawLines()}
function addLine(){window.editLines.push({ingredientId:db.ingredients[0]?.id||'',qty:0});drawLines()}
function drawLines(){document.getElementById('lines').innerHTML=window.editLines.map((l,i)=>`<div class="recipe-line"><div class="field"><label>Ingrediente</label><select onchange="editLines[${i}].ingredientId=this.value">${db.ingredients.map(x=>`<option value="${x.id}" ${x.id===l.ingredientId?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input type="number" value="${l.qty}" onchange="editLines[${i}].qty=+this.value"></div><div class="label">${money(ingredientCost(db.ingredients.find(x=>x.id===l.ingredientId))*l.qty)}</div><button class="danger" onclick="editLines.splice(${i},1);drawLines()">×</button></div>`).join('')}
function saveRecipe(id){let r={id:id||uid('r'),name:rn.value.trim(),cat:rc.value.trim(),yield:+ry.value,lines:window.editLines};if(!r.name||r.yield<=0){alert('Completa nombre y rendimiento.');return}let old=db.recipes.find(x=>x.id===id);if(old)Object.assign(old,r);else db.recipes.push(r);save();closeModal();render()}
function openProduct(id){let p=db.products.find(x=>x.id===id)||{name:'',recipeId:db.recipes[0]?.id||'',pack:0,labor:0,price:0,active:true};modal(`<div class="modalhead"><h2>${id?'Editar':'Nuevo'} producto</h2><button class="secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><div class="field"><label>Nombre</label><input id="pn" value="${p.name}"></div><div class="field"><label>Receta</label><select id="pr">${db.recipes.map(r=>`<option value="${r.id}" ${r.id===p.recipeId?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label>Packaging por unidad</label><input id="pp" type="number" value="${p.pack}"></div><div class="field"><label>Mano de obra por unidad</label><input id="pl" type="number" value="${p.labor}"></div><div class="field"><label>Precio de venta neto</label><input id="px" type="number" value="${p.price}"></div><div class="field"><label>Estado</label><select id="pa"><option value="true" ${p.active?'selected':''}>Activo</option><option value="false" ${!p.active?'selected':''}>Inactivo</option></select></div></div><div class="notice">Costo actual: <b id="previewCost">${money(productCost(p))}</b> · Margen: <b id="previewMargin">${fmt(margin(p))}%</b></div><button onclick="saveProduct('${id||''}')">Guardar producto</button>`)}
function saveProduct(id){let p={id:id||uid('p'),name:pn.value.trim(),recipeId:pr.value,pack:+pp.value,labor:+pl.value,price:+px.value,active:pa.value==='true'};let old=db.products.find(x=>x.id===id);if(old)Object.assign(old,p);else db.products.push(p);save();closeModal();render()}
function openFixed(id){let x=db.fixed.find(i=>i.id===id)||{name:'',amount:0,period:'Mensual'};modal(`<div class="modalhead"><h2>${id?'Editar':'Agregar'} costo fijo</h2><button class="secondary" onclick="closeModal()">Cerrar</button></div><div class="form"><div class="field"><label>Nombre</label><input id="fn" value="${x.name}"></div><div class="field"><label>Monto mensual</label><input id="fa" type="number" value="${x.amount}"></div></div><button style="margin-top:15px" onclick="saveFixed('${id||''}')">Guardar</button>`)}
function saveFixed(id){let x={id:id||uid('f'),name:fn.value.trim(),amount:+fa.value,period:'Mensual'};let old=db.fixed.find(i=>i.id===id);if(old)Object.assign(old,x);else db.fixed.push(x);save();closeModal();render()}
function del(type,id){if(confirm('¿Eliminar este registro?')){db[type]=db[type].filter(x=>x.id!==id);save();render()}}
function saveSettings(){db.settings.iva=+document.getElementById('iva').value;db.settings.target=+document.getElementById('target').value;db.settings.currency=document.getElementById('currency').value;save();alert('Configuración guardada');render()}
function resetData(){if(confirm('Esto reemplazará tus datos por los datos de ejemplo. ¿Continuar?')){db=structuredClone(seed);save();render()}}
renderNav();render();
</script>
</body>
</html>
